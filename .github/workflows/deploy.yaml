name: Deploy-react

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - users: action/checkout@v2
      - run: docker login -u ${{secrets.DOCKER_USERNAME }} - ${{secrets.DOCKER_PASSWORD }}
      - run: docker build -t judyassem/react-test -f Dockerfile.dev .
      - run: docker run -e CI=true judyassem/react-test npm run test